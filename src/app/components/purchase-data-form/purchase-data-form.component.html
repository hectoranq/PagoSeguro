<div class="min-h-screen bg-[#fdfdfd] flex flex-col max-w-sm mx-auto">


  <!-- Header -->
  <div class="flex items-center px-6 py-4">
    <lucide-icon name="ChevronLeft" class="w-6 h-6 mr-4"></lucide-icon>
    <h1 class="text-xl font-semibold text-center flex-1 mr-10">Datos de compra</h1>
  </div>

  <!-- Main Content -->
  <div class="flex-1 px-6 py-4">
    <h2 class="text-xl font-semibold mb-8 text-black">Ingrese los datos de la compra</h2>

    <!-- Seller Phone Number -->
    <div class="mb-6">
      <label class="block text-base font-medium mb-3 text-black">Número de celular del vendedor</label>
      
      <!-- Input and Seller Info in same row -->
      <div class="flex gap-3">
        <!-- Input Section - 50% -->
        <div class="flex-1">
          <input
            placeholder="Número de celular"
            class="w-full h-12 border border-[#c6c6c6] rounded-lg px-3 text-[#c6c6c6]"
          />
        </div>
        
        <!-- Seller Info Section - 50% -->
        <div class="flex-1 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="font-medium text-black text-sm">Ivan</span>
            <div class="flex items-center">
              <span class="text-[#f7b305] text-sm">★★★★</span>
              <span class="text-[#c6c6c6] text-sm">★</span>
            </div>
          </div>
          <div class="w-5 h-5 rounded-full border-2 border-[#c6c6c6] flex items-center justify-center">
            <svg class="w-3 h-3 text-[#c6c6c6]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="m9 12 2 2 4-4"></path>
              <path d="M21 12c.552 0 1-.448 1-1s-.448-1-1-1-1 .448-1 1 .448 1 1 1z"></path>
              <path d="M12 7h.01"></path>
              <path d="M12 17v-6"></path>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Product Name -->
    <div class="mb-6">
      <label class="block text-base font-medium mb-3 text-black">Nombre del producto</label>
      <input
        placeholder="Producto"
        class="w-full h-12 border border-[#c6c6c6] rounded-lg px-3 text-[#c6c6c6]"
      />
    </div>

    <!-- Agreed Price -->
    <div class="mb-8">
      <label class="block text-base font-medium mb-3 text-black">Precio acordado</label>
      <input
        placeholder="Monto en Bs"
        class="w-full h-12 border border-[#c6c6c6] rounded-lg px-3 text-[#c6c6c6]"
      />
    </div>

    <!-- Product Image Upload -->
    <div class="mb-8">
      <label class="block text-base font-medium mb-6 text-black">Imagen del producto (foto de pantalla)</label>
      <div
        class="flex flex-col items-center justify-center py-12 border-2 border-dashed border-[#c6c6c6] rounded-lg"
      >
        <div class="w-12 h-12 bg-[#eb3030] rounded-lg flex items-center justify-center mb-4">
          <lucide-icon name="Upload" class="w-6 h-6 text-white"></lucide-icon>
        </div>
        <span class="text-[#eb3030] font-medium">Cargar imagen</span>
      </div>
    </div>

    <!-- Next Button -->
    <button
      (click)="siguiente()"
      class="w-full h-14 bg-[#eb3030] hover:bg-[#f83758] text-white text-lg font-medium rounded-lg mb-8"
    >
      Siguiente
    </button>
  </div>

  <!-- Bottom Navigation -->
  <div class="flex items-center justify-around py-4 border-t border-[#f5f5f5]">
    <div class="flex flex-col items-center">
      <lucide-icon name="Home" class="w-6 h-6 text-black mb-1"></lucide-icon>
      <span class="text-xs text-black">Inicio</span>
    </div>
    <div class="flex flex-col items-center">
      <lucide-icon name="ShoppingCart" class="w-6 h-6 text-[#eb3030] mb-1"></lucide-icon>
    </div>
    <div class="flex flex-col items-center">
      <lucide-icon name="Package" class="w-6 h-6 text-black mb-1"></lucide-icon>
      <span class="text-xs text-black">En Proceso</span>
    </div>
  </div>
</div>
